name: Pull Docker Image and Upload（adguardhome）

on:
  workflow_dispatch:

jobs:
  pull-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Pull and Save Image using Podman (Legacy Format)
      run: |
        # 1. 使用 podman 拉取指定 x86_64/amd64 架构镜像
        podman pull --platform linux/amd64 docker.io/adguard/adguardhome:latest
        
        # 2. 显式指定导出格式为绝对兼容的传统格式 docker-archive
        podman save --format docker-archive -o ${{ github.workspace }}/adguardhome.tar docker.io/adguard/adguardhome:latest
        
        # 3. 验证文件体积与确认生成
        ls -lh ${{ github.workspace }}

    - name: Upload image as artifact
      uses: actions/upload-artifact@v4
      with:
        name: adguardhome-image-x86
        path: ${{ github.workspace }}/adguardhome.tar
        if-no-files-found: error
