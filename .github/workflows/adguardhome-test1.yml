name: adguardhome-test1

on:
  workflow_dispatch:

jobs:
  pull-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Pull and Save Docker Image (Legacy Format)
      run: |
        # 1. 显式拉取指定架构的镜像（RouterOS 容器设备通常为 linux/arm64 或 linux/arm/v7）
        # 如果你的设备是 x86_64 / CHR，请将下方 platform 改为 linux/amd64
        docker pull --platform linux/arm64 adguard/adguardhome:latest
        
        # 2. 导出为兼容 RouterOS 的传统 Tar 包格式
        docker save adguard/adguardhome:latest -o adguardhome.tar

    - name: Upload image as artifact
      uses: actions/upload-artifact@v4
      with:
        name: adguardhome-image
        path: adguardhome.tar
