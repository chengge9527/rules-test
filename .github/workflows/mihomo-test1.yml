name: mihomo-test1

on:
  workflow_dispatch:

jobs:
  pull-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install Skopeo
      run: |
        sudo apt-get update
        sudo apt-get install -y skopeo

    - name: Fetch and Export compatible image using Skopeo
      run: |
        
        # 2. 绕过本地 Docker/Podman，直接从 Docker Hub 将指定架构(amd64) 转换并拉取到本地单一 Tar 包内
        # 这种格式对于旧版 OCI 运行时（如 RouterOS）具有极高的兼容性
        skopeo copy \
          --override-os linux \
          --override-arch amd64 \
          docker://docker.io/metacubex/mihomo:v1.19.25 \
          docker-archive:${{ github.workspace }}/mihomo.tar:docker.io/metacubex/mihomo:v1.19.25
          
        # 3. 确认生成的文件和大小
        ls -lh ${{ github.workspace }}

    - name: Upload image as artifact
      uses: actions/upload-artifact@v4
      with:
        name: mihomo-image
        path: ${{ github.workspace }}/mihomo.tar
        if-no-files-found: error
