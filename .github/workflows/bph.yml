name: Pull Docker Image and Upload（pbh）

on:
  workflow_dispatch:

jobs:
  pull-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Python Docker SDK
      run: pip install docker

    - name: Pull Docker image using Python
      run: |
          python <<'EOF'
          import docker

          client = docker.from_env()

          image_name = "ghostchu/peerbanhelper:latest"  # 替换为你需要的镜像名
          output_file = "peerbanhelper.tar"

          print(f"Pulling image: {image_name}")
          image = client.images.pull(image_name)

          print(f"Saving image to {output_file}")
          with open(output_file, "wb") as f:
              for chunk in image.save(named=True):
                  f.write(chunk)

          print("Done.")
          EOF


    - name: Upload image as artifact
      uses: actions/upload-artifact@v4
      with:
        name: peerbanhelper-image
        path: peerbanhelper.tar
